[build]
    command = "npm run build"
    functions = "netlify_functions"
    publish = "build"
    ignore = "node_modules"
    include = [
        "netlify_functions/dictionary.gaddag.json",
        "netlify_functions/leaves.json",
        "netlify_functions/twl-wordlist.json"
    ]

[functions]
    included_files = [
        "netlify_functions/leaves.json",
        "netlify_functions/dictionary.gaddag.json",
        "netlify_functions/twl-wordlist.json"
    ]
    node_bundler = "esbuild"
    external_node_modules = ["aws-sdk"]

# Configure specific functions with higher limits
# Memory options: 1024, 2048, 3008, 10240 MB
# Timeout options: 10, 30, 60 seconds
[functions.botLogic]
    timeout = 30
    memory = 3008

[functions.getTopMoves]
    timeout = 30
    memory = 3008

[functions.generateMoves]
    timeout = 30
    memory = 3008

[functions.getBoardControl]
    timeout = 20
    memory = 2048

[functions.gameLogic]
    timeout = 15
    memory = 2048

[functions.studyLogic]
    timeout = 20
    memory = 2048

[functions.loadDictionary]
    timeout = 10
    memory = 1024

[functions.getLeaveValues]
    timeout = 10
    memory = 1024

[functions.loadBoggleDictionary]
    timeout = 10
    memory = 1024

[functions.scanBoard]
    timeout = 45
    memory = 1024

[functions.proxy]
    timeout = 15
    memory = 1024

[functions.getTopPlayers]
    timeout = 15
    memory = 1024

[functions.multiplayerGame]
    timeout = 15
    memory = 1024

# Keeps the Railway-hosted bot move-generator warm so it doesn't cold-start
# (runs every 10 minutes, regardless of site traffic)
[functions.pingBotService]
    schedule = "*/10 * * * *"
    timeout = 15
    memory = 1024

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Headers for HTML - prevent caching to ensure users get latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Headers for index.html specifically
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Headers for service worker - always check for updates
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Headers for static assets - can cache but with versioning
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
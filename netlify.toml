[build]
    command = "npm run build"
    functions = "netlify_functions"
    publish = "build"
    include = [
        "netlify_functions/dictionary.gaddag.json",
        "netlify_functions/leaveValues.json"
    ]

[functions]
    included_files = [
        "netlify_functions/leaves.json",
        "netlify_functions/dictionary.gaddag.json"
    ]
    node_bundler = "esbuild"
    external_node_modules = ["aws-sdk"]

[functions.memory]
    external_node_modules = ["aws-sdk"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200